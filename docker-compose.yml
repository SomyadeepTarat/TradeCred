name: tradecred
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradecred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradecred_local}
      POSTGRES_DB: ${POSTGRES_DB:-tradecred}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tradecred}:${POSTGRES_PASSWORD:-tradecred_local}@postgres:5432/${POSTGRES_DB:-tradecred}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      DOCUMENT_STORAGE_PATH: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LEDGER_BACKEND: ${LEDGER_BACKEND:-mock}
      DRUNIX_GATEWAY_URL: ${DRUNIX_DOCKER_GATEWAY_URL:-http://drunix-gateway:8080}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      SIMULATOR_URL: http://bank-simulator:8090
      SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-}
      DRUNIX_GATEWAY_TOKEN: ${DRUNIX_GATEWAY_TOKEN:-}
      DRUNIX_NETWORK_ID: ${DRUNIX_NETWORK_ID:-}
      DRUNIX_CHANNEL: ${DRUNIX_CHANNEL:-}
      DRUNIX_CHAINCODE_NAME: ${DRUNIX_CHAINCODE_NAME:-tradecred}
      BANK_TRUSTED_KEYS: '{"demo-bank-1":{"bank_id":"BANK_SETTLEMENT_01","organization_id":"ORG_SETTLEMENT_BANK","public_key_path":"/bank-public/bank-public.pem"}}'
      PAYMENT_TIMESTAMP_TOLERANCE_SECONDS: ${PAYMENT_TIMESTAMP_TOLERANCE_SECONDS:-300}
    volumes:
      - document_data:/data/documents
      - type: bind
        source: ./data/bank-public
        target: /bank-public
        read_only: true
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  bank-simulator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/bank-simulator/Dockerfile
      additional_contexts:
        api_image: service:api
    environment:
      SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-}
      BANK_PRIVATE_KEY_PATH: /bank-keys/bank-private.pem
    volumes:
      - ./data/bank-keys:/bank-keys:ro
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  drunix-gateway:
    profiles: ["drunix"]
    build: ./services/drunix-gateway
    environment:
      DRUNIX_GATEWAY_TOKEN: ${DRUNIX_GATEWAY_TOKEN:-}
      DRUNIX_GATEWAY_CONFIG: /config/gateway.json
      DRUNIX_LISTEN: 0.0.0.0:8080
    volumes:
      - ./data/drunix/config:/config:ro
      - ./data/drunix/identities:/identities:ro
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres_data:
  document_data:
