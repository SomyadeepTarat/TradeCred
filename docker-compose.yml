name: tradecred
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradecred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradecred_local}
      POSTGRES_DB: ${POSTGRES_DB:-tradecred}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tradecred}:${POSTGRES_PASSWORD:-tradecred_local}@postgres:5432/${POSTGRES_DB:-tradecred}
      LEDGER_BACKEND: ${LEDGER_BACKEND:-mock}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
