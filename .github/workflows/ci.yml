name: TradeCred checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: tradecred-ci-only-signing-key-0123456789
      DEMO_PASSWORD: TradeCred-CI-2026!
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradecred
          POSTGRES_PASSWORD: tradecred_local
          POSTGRES_DB: tradecred
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradecred -d tradecred"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: |
            blockchain/chaincode/tradecred/go.sum
            services/drunix-gateway/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          python-version: "3.12"
      - run: make install
      - run: make test
      - run: make lint
      - run: make build-chaincode build-gateway
      - run: make migrate
      - run: make seed
      - run: make test-integration
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: make test-e2e
      - run: docker compose config --quiet

  fresh-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          python-version: "3.12"
      - run: make test-setup
